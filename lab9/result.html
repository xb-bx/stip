<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторні роботи</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="/style.css">
    <script src="main.js"></script>
</head>
<body>
    <h3>Оригінальні дані</h3>
    <table id="originalTable">
        <thead>
            <tr>
                <th>Country</th>
                <th>Type</th>
                <th>Theme</th>
                <th>Title</th>
                <th>Frequency</th>
                <th>Price</th>
                <th>Subscription index</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <h3>Дані відсортовані за ціною</h3>
    <table id="sortedTable">
        <thead>
            <tr>
                <th>Country</th>
                <th>Type</th>
                <th>Theme</th>
                <th>Title</th>
                <th>Frequency</th>
                <th>Price</th>
                <th>Subscription index</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <h3>Дані відфільтровані за періодичністю виходу</h3>
    <table id="filteredTable">
        <thead>
            <tr>
                <th>Country</th>
                <th>Type</th>
                <th>Theme</th>
                <th>Title</th>
                <th>Frequency</th>
                <th>Price</th>
                <th>Subscription index</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</body>
</html>
